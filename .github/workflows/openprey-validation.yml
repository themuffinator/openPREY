name: openPREY Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openprey-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold-contracts:
    name: Scaffold and Content Contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout openPREY
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate scripts and in-tree game sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/build/build_openq4_pack.py \
            tools/build/generate_pak_header.py \
            tools/build/generate_savegame_compat_header.py \
            tools/build/openq4_pak.py \
            tools/build/game_source_inventory.py             tools/build/content_packs.py \
            tools/build/write_pak_manifest.py \
            tools/tests/openprey_rebase_contract.py \
            tools/tests/linux_sanitizer_source_contract.py
          bash -n tools/build/meson_setup.sh
          python tools/build/sync_icons.py --check
          python tools/build/game_source_inventory.py . > /dev/null
          python tools/build/content_packs.py meson-list
          python tools/tests/openprey_rebase_contract.py
          python tools/tests/linux_sanitizer_source_contract.py

      - name: Validate pak0 and pak1 inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/ci-paks
          for pak in pak0 pak1; do
            python tools/build/write_pak_manifest.py \
              "${GITHUB_WORKSPACE}" \
              "${pak}.pk4" \
              "content/basepr/${pak}" \
              ".tmp/ci-paks/${pak}.sources"
            python tools/build/build_openq4_pack.py \
              --pak-name "${pak}.pk4" \
              --source-dir "content/basepr/${pak}" \
              --manifest ".tmp/ci-paks/${pak}.sources" \
              --out ".tmp/ci-paks/${pak}.pk4"
          done

  unified-gamelib:
    name: Unified GameLib (${{ matrix.platform }})
    needs: scaffold-contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            os: windows-2025
            module: game_x64.dll
            client: openPREY-client_x64.exe
            dedicated: openPREY-ded_x64.exe
            renderer_gl: renderer-gl_x64.dll
            renderer_vk: renderer-vk_x64.dll
          - platform: Linux x64
            os: ubuntu-24.04
            module: game_x64.so
            client: openPREY-client_x64
            dedicated: openPREY-ded_x64
            renderer_gl: renderer-gl_x64.so
            renderer_vk: renderer-vk_x64.so

    steps:
      - name: Checkout openPREY
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Meson and Ninja
        shell: bash
        run: python -m pip install meson ninja

      # The engine links system GL and builds SDL3 from its wrap, which needs the
      # X11, Wayland and audio development headers. Same list as upstream
      # openQ4's Linux x64 validation lane, without its Wayland smoke compositor.
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y \
              binutils \
              libasound2-dev \
              libdbus-1-dev \
              libdecor-0-dev \
              libdrm-dev \
              libegl1-mesa-dev \
              libfribidi-dev \
              libgbm-dev \
              libgl1-mesa-dri \
              libgl1-mesa-dev \
              libglx-mesa0 \
              libibus-1.0-dev \
              libjack-dev \
              libopenal-dev \
              libpipewire-0.3-dev \
              libpulse-dev \
              libsndio-dev \
              libthai-dev \
              libudev-dev \
              libwayland-dev \
              libx11-dev \
              libxcursor-dev \
              libxext-dev \
              libxfixes-dev \
              libxi-dev \
              libxkbcommon-dev \
              libxrandr-dev \
              libxss-dev \
              libxtst-dev \
              libxxf86dga-dev \
              libxxf86vm-dev; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to install Linux native dependencies after ${attempt} attempts."
              exit 1
            fi

            echo "Linux dependency installation attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done

      # Staging bundles OpenAL32.dll beside the client. The runner has no local
      # src/external/openal-soft runtime, so prepare one as upstream openQ4 does.
      - name: Prepare OpenAL Soft (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE ".tmp/openal-soft-x64"
          $env:OPENPREY_VS_TARGET_ARCH = "x64"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/prepare_windows_openal.ps1 -Architecture "x64" -OutputRoot $outputRoot
          "OPENPREY_OPENAL_ROOT=$outputRoot" >> $env:GITHUB_ENV

      - name: Configure, build, and stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 setup --wipe builddir . --backend ninja --buildtype debug --wrap-mode=forcefallback -Dbuild_engine=true -Dbuild_games=true -Dbuild_renderer_gl=true -Dbuild_renderer_vk=true
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 compile -C builddir
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build/meson_setup.ps1 install -C builddir --no-rebuild --skip-subprojects

      - name: Configure, build, and stage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build/meson_setup.sh setup --wipe builddir . --backend ninja --buildtype debug --wrap-mode=forcefallback -Dbuild_engine=true -Dbuild_games=true -Dbuild_renderer_gl=true -Dbuild_renderer_vk=true
          bash tools/build/meson_setup.sh compile -C builddir
          bash tools/build/meson_setup.sh install -C builddir --no-rebuild --skip-subprojects

      - name: Verify unified staged payload
        shell: bash
        run: |
          set -euo pipefail
          test -f ".install/${{ matrix.client }}"
          test -f ".install/${{ matrix.dedicated }}"
          test -f ".install/${{ matrix.renderer_gl }}"
          test -f ".install/${{ matrix.renderer_vk }}"
          test -f ".install/basepr/${{ matrix.module }}"
          test -f ".install/basepr/pak0.pk4"
          test -f ".install/basepr/pak1.pk4"
          test -f ".install/basepr/mod.json"
          test -f ".install/openPREY.ico"
          test -f ".install/openPREY.icns"
          if [ "${{ runner.os }}" = "Linux" ]; then
            test -f ".install/share/applications/openprey.desktop"
            test -f ".install/share/applications/openprey-steamdeck.desktop"
            test -f ".install/share/icons/hicolor/256x256/apps/openprey.png"
          fi
          if find .install/basepr -maxdepth 1 -type f \( \
              -name 'game-sp_*' -o -name 'game-mp_*' -o \
              -name 'game_sp_*' -o -name 'game_mp_*' \) | grep -q .; then
            echo "Split GameLib artifacts must not be staged; openPREY ships one game_<arch> module."
            exit 1
          fi
