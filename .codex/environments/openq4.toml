# Codex app environment. The setup script and actions run VS Code entries through
# .codex/scripts/run-vscode-entry.ps1, naming each task by its label and each
# launch by its configuration name. Positions are not stable:
# tools/debug/generate_vscode_launch.py regroups .vscode/launch.json.
# tools/tests/vscode_fast_build.py checks that every action runs an entry that
# exists and is named after it.
#
# The launches are the main menus and their variants, then the first level of
# each campaign and the first map of each stock multiplayer mode, on both
# renderers. VS Code's Run and Debug list has the rest.
name = "openQ4"

[setup]
script = 'echo "No Codex setup script is configured for this platform."'

[setup.win32]
script = '''powershell -NoProfile -ExecutionPolicy Bypass -File .codex\scripts\run-vscode-entry.ps1 task "Configure openQ4 (Meson Optimized)"'''

[[actions]]
name = "Configure openQ4 (Meson Optimized)"
command = '''powershell -NoProfile -ExecutionPolicy Bypass -File .codex\scripts\run-vscode-entry.ps1 task "Configure openQ4 (Meson Optimized)"'''
icon = "tool"
platform = "win32"

[[actions]]
